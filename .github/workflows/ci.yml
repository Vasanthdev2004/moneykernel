name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
        env:
          POSTGRES_USER: moneykernel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: moneykernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneykernel -d moneykernel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://moneykernel:ci-only-password@127.0.0.1:5432/moneykernel
      DATABASE_URL_TEST: postgresql://moneykernel:ci-only-password@127.0.0.1:5432/moneykernel
      OPERATOR_BOOTSTRAP_SECRET: ci-operator-bootstrap-secret-value
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.3.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks and build
        run: pnpm lint && pnpm typecheck && pnpm build
      - name: Unit, property, and contract tests
        run: pnpm test:unit && pnpm test:property && pnpm test:contracts
      - name: Database and fault tests
        run: pnpm test:integration && pnpm test:fault
      - name: Browser tests
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - name: Build production image
        run: docker build --tag moneykernel:ci .
